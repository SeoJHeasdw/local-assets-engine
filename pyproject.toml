[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "local-assets-engine"
version = "0.1.0"
description = "Local 2D/3D game asset generation engine for Apple Silicon"
requires-python = ">=3.13,<3.14"
license = { text = "Private" }
authors = [{ name = "Jaeho Seo" }]
dependencies = [
    "bpy==5.2.2",
    "einops>=0.8.2",
    "fastapi>=0.141.1",
    "kornia>=0.8.3",
    "mflux==0.19.1",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "timm>=1.0.29",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "transformers>=5.17.0",
    "trimesh>=5.1.0",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
local-assets = "local_assets_engine.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "scipy>=1.18.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/local_assets_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
